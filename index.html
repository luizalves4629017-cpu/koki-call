<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Provas" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Seja feliz com todas as suas escolhas e provas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <style>/* Hark's design tokens and component styles. Each component's rules follow its @component comment. style-gates: data */

/* @component foundations */
/* Every component switches layout at one of three widths: 600px, below which a page takes a phone's
   spacing; 761px, from which two-up components (stats, checklists, pairs) sit side by side; and 900px,
   from which heads, steps, timelines, cards and the hero's callout take their desktop layout. Media
   queries cannot read custom properties, so each query writes one side of those widths, and
   TestKitStylesheetsShareThreeBreakpoints holds every kit file to them. */
:root {
  color-scheme: light dark;

  --text-primary: #1d1d1f;
  --text-secondary: #636366;
  --text-tertiary: #1d1d1f4d;
  --text-primary-on: #f5f5f7;
  --text-secondary-on: #aeaeb2;
  --fill-primary: #1d1d1f;
  --fill-primary-on: #f5f5f7;
  --fill-secondary: #1d1d1f80;
  --fill-tertiary: #e8e8ea;
  --fill-segment: #3a3a3c;
  --fill-system-green: #00a665;                         /* status: done, ready */
  --fill-system-orange: #ff4d00;                        /* status: now, current */
  --fill-system-red: #da2f35;
  --transparent-primary: #1d1d1f4d;
  --stroke-primary: #1d1d1f24;
  --stroke-secondary: #1d1d1f12;
  --stroke-primary-on: #f5f5f71a;
  --stroke-composer: #f5f5f780;
  --stroke-system-orange: #ff4d0026;
  --hover-wash: #1d1d1f0d;
  --hover-wash-primary-on: #f9f9fa26;

  /* The hero is light text over a dark photo in both themes. */
  --hero-surface: #161f39;
  --hero-text: #f5f5f7;
  --hero-text-muted: #f5f5f7cc;
  --hero-scrim-strong: rgb(22 31 57 / 0.78);
  --hero-scrim-soft: rgb(22 31 57 / 0.3);
  --hero-scrim-side: rgb(22 31 57 / 0.45);
  --hero-glass: rgb(22 31 57 / 0.42);
  --hero-glass-faint: rgb(22 31 57 / 0.35);
  --hero-glass-stroke: rgb(245 245 247 / 0.28);

  --mat-regular: rgb(255 255 255 / 0.56);
  --mat-thin: rgb(255 255 255 / 0.22);
  --mat-agent: rgb(255 255 255 / 0.84);
  --mat-inverse: rgba(29,29,31,.86);  /* the nav: dark on light, light on dark */
  --hark-blur: blur(50px) saturate(1.6);
  --hark-shadow: 0 8px 40px #1d1d1f1f;

  --sans: "GT Standard", "GT Standard L", "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --lh: 1.3;                                            /* every text style is 130% */
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-bold: 600;
  --size-caption: 12px;                                 /* the smallest text allowed */
  --size-meta: 13px;
  --size-small: 14px;
  --size-body: 15px;
  --size-prose: 16px;
  --size-heading: 20px;
  --size-figure: clamp(24px, 3vw, 32px);
  --size-title: clamp(26px, 3vw, 32px);
  --size-display: clamp(34px, 5vw, 48px);
  --size-lede: clamp(16px, 1.7vw, 20px);

  --type-caption: var(--weight-regular) var(--size-caption)/var(--lh) var(--sans);
  --type-tag: var(--weight-medium) var(--size-caption)/var(--lh) var(--sans);
  --type-small: var(--weight-regular) var(--size-small)/var(--lh) var(--sans);
  --type-label: var(--weight-medium) var(--size-small)/var(--lh) var(--sans);
  --type-body: var(--weight-regular) var(--size-body)/var(--lh) var(--sans);
  --type-body-strong: var(--weight-medium) var(--size-body)/var(--lh) var(--sans);
  --type-heading: var(--weight-medium) var(--size-heading)/var(--lh) var(--sans);
  --type-lede: var(--weight-medium) var(--size-lede)/var(--lh) var(--sans);
  --type-figure: var(--weight-regular) var(--size-figure)/var(--lh) var(--sans);
  --type-title: var(--weight-regular) var(--size-title)/var(--lh) var(--sans);
  --type-display: var(--weight-medium) var(--size-display)/var(--lh) var(--sans);
  --type-numeral: var(--weight-regular) 48px/1 var(--sans);

  --r-s: 12px;
  --r-m: 16px;
  --r-l: 24px;
  --r-xl: 32px;
  --r-pill: 100px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur-quick: 160ms;

  --page-max: 1120px;
  --gutter: clamp(16px, 3vw, 32px);                     /* the page's side padding */
  --tap: 44px;                                          /* the smallest touch target */
}
:root[data-theme="dark"] {
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --text-tertiary: #f5f5f74d;
  --text-primary-on: #1d1d1f;
  --text-secondary-on: #5c5c60;
  --fill-primary: #f5f5f7;
  --fill-primary-on: #1d1d1f;
  --fill-secondary: #f5f5f780;
  --fill-tertiary: #2a2a2d;
  --fill-segment: #e2e2e4;
  --fill-system-red: #f1555b;
  --transparent-primary: #f5f5f74d;
  --stroke-primary: #f5f5f724;
  --stroke-secondary: #f5f5f712;
  --stroke-primary-on: #1d1d1f1a;
  --stroke-composer: #1d1d1f80;
  --hover-wash: #f5f5f70d;
  --hover-wash-primary-on: #1d1d1f14;
}

:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
/* The page keeps its own bounce but never hands a fling on: a page is framed in Hark's /site
   page, and a fling past its top would otherwise carry on into that page and drag the frame down. */
html, body { overscroll-behavior-y: contain; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* The page background lives on body and html stays transparent, so the browser paints the whole
   canvas, and the band a bounce reveals, in body's color, including a page's own override of it. */
body {
  margin: 0;
  background: var(--fill-primary-on);
  color: var(--text-primary);
  font: var(--type-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
figure { margin-inline: 0; }
a { color: inherit; }
b, strong { font-weight: var(--weight-bold); }
p { margin: 0; text-wrap: pretty; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
small { font-size: max(var(--size-caption), 0.85em); }
.sub { color: var(--text-secondary); }

:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 3px; border-radius: 6px; }

/* @component page */
.page {
  max-width: var(--page-max);
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: 12px 40px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }

.glass {
  background: var(--mat-inverse);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  border: 1px solid var(--stroke-primary-on);
}
.nav {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  z-index: 20;
  justify-self: center;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  border-radius: var(--r-pill);
  box-shadow: var(--hark-shadow);
}
.nav :focus-visible { outline-color: var(--fill-primary-on); }
.seg {
  display: flex;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: var(--r-pill);
  background: var(--fill-segment);
}
.seg::-webkit-scrollbar { display: none; }
.seg a {
  flex: none;
  padding: 8px 14px;
  border-radius: var(--r-pill);
  font: var(--type-label);
  color: var(--text-secondary-on);
  text-decoration: none;
  white-space: nowrap;
}
.seg a:hover { color: var(--text-primary-on); }
/* The active tab carries its own fill so its text is measured against it. */
.seg a[aria-current="true"] { background: var(--fill-primary-on); color: var(--text-primary); }
.theme-btn {
  flex: none;
  width: 36px; height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--hover-wash-primary-on);
  color: var(--text-primary-on);
  cursor: pointer;
}
.theme-btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash-primary-on); }
.theme-btn::before { content: ""; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; background: linear-gradient(to right, currentColor 50%, transparent 50%); }
@media (max-width: 599px) {
  .seg a { display: flex; align-items: center; min-height: var(--tap); }
  .theme-btn { width: var(--tap); height: var(--tap); }
}

/* @component footer */
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px 24px;
  padding-top: 24px;
  border-top: 1px solid var(--stroke-secondary);
  font-size: var(--size-small);
  color: var(--text-secondary);
}
.foot strong { color: var(--text-primary); }
.foot nav { display: flex; flex-wrap: wrap; gap: 6px; }
.foot nav a {
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--fill-tertiary);
  color: var(--text-primary);
  font: var(--type-tag);
  text-decoration: none;
}
.foot nav a:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--r-xl);
  background: var(--fill-primary);
  color: var(--text-primary-on);
  box-shadow: var(--hark-shadow);
  font: var(--weight-medium) var(--size-body)/1.1 var(--sans);
  text-decoration: none;
}
.badge:hover { box-shadow: var(--hark-shadow), inset 0 0 0 100px var(--hover-wash-primary-on); }
.hark-mark { display: inline-grid; place-items: center; }
.hark-mark svg { display: block; }
@media (max-width: 599px) {
  .foot nav a { display: inline-flex; align-items: center; min-height: var(--tap); min-width: var(--tap); }
  .badge { min-height: var(--tap); }
}

/* @component chip */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 8px;
  border-radius: var(--r-pill);
  font: var(--type-tag);
  max-width: 100%;
  background: var(--fill-tertiary);
  color: var(--text-secondary);
  vertical-align: middle;
}
.chip::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  flex: none;
  box-shadow: inset 0 0 0 1.5px var(--text-tertiary);
}
.chip--solid { background: var(--fill-primary); color: var(--text-primary-on); }
.chip--solid::before { background: var(--fill-system-green); box-shadow: none; }
td .chip { white-space: nowrap; }
/* @component dot */
.dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font: var(--type-tag);
  color: var(--text-primary);
}
.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fill-system-green); }
tbody th .dot { display: flex; width: fit-content; }
/* @component pill */
.pill {
  display: inline-block;
  padding: 1px 8px;
  border-radius: var(--r-pill);
  background: var(--fill-tertiary);
  color: var(--text-secondary);
  font: var(--type-tag);
  white-space: normal;
  vertical-align: 1px;
}
/* @component button, link and links */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 5px 12px;
  border-radius: var(--r-s);
  background: var(--fill-primary-on);
  color: var(--text-primary);
  border: 1px solid var(--stroke-primary);
  font: var(--type-tag);
  text-decoration: none;
  max-width: 100%;
  transition: box-shadow var(--dur-quick) ease;
}
.btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
.btn[target="_blank"]::after { content: "\2197"; font-size: 11px; color: var(--text-secondary); }
.link {
  color: var(--text-primary);
  text-decoration: underline;
  text-decoration-color: var(--stroke-primary);
  text-underline-offset: 3px;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.link:hover { text-decoration-color: currentColor; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
@media (pointer: coarse), (max-width: 599px) { .btn { min-height: var(--tap); padding-inline: 14px; } }

/* A button that asks Hark is the page's primary capsule. Once it sends, Hark
   writes a check and "Sent to Hark" into it, and it turns secondary. A press
   that does not send shows a short notice in place of its words for a moment. */
.btn[data-hark-action] {
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--fill-primary);
  color: var(--text-primary-on);
  font: var(--type-body-strong);
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  transition: box-shadow var(--dur-quick) ease, transform var(--dur-quick) ease;
}
.btn[data-hark-action]:hover { box-shadow: inset 0 0 0 100px var(--hover-wash-primary-on); }
.btn[data-hark-action]:active { transform: scale(0.97); }
.btn[data-hark-action] svg { flex: none; }
.btn[data-hark-action][data-hark-state="sent"] { background: var(--fill-tertiary); color: var(--text-primary); box-shadow: none; }

[data-hark-action][data-hark-state="sending"] { opacity: 0.6; pointer-events: none; }
[data-hark-action][data-hark-state="sent"] { pointer-events: none; cursor: default; }
@media (max-width: 599px) {
  .link { display: inline-flex; align-items: center; min-width: var(--tap); min-height: var(--tap); margin: -13px 0; vertical-align: middle; }
}
/* @component text and fineprint */
.prose { display: grid; gap: 12px; max-width: 68ch; font-size: var(--size-prose); }
.fineprint { font-size: var(--size-small); color: var(--text-secondary); max-width: 70ch; }
/* @component hero */
.hero {
  position: relative;
  min-height: clamp(320px, 46vh, 480px);
  border-radius: var(--r-xl);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  color: var(--hero-text);
  isolation: isolate;
  box-shadow: var(--hark-shadow);
  background: var(--hero-surface);
}
/* Without a photo the hero is as tall as its copy, so the callout sits beside the copy instead of over it. */
.hero:not(:has(.hero__img)) { min-height: 0; background: var(--hero-surface) center / cover no-repeat; }
.hero:not(:has(.hero__img))::after { background: linear-gradient(to right, var(--hero-scrim-side) 0%, transparent 60%); }
@media (min-width: 900px) {
  .hero:not(:has(.hero__img)) > .callout { position: static; flex: none; align-self: flex-start; margin: clamp(16px, 2.4vw, 24px) clamp(16px, 2.4vw, 24px) clamp(16px, 2.4vw, 24px) auto; }
}
.hero__img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 40% 60%;
  z-index: -2;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(to top, var(--hero-scrim-strong) 0%, var(--hero-scrim-soft) 42%, transparent 66%),
    linear-gradient(to right, var(--hero-scrim-side) 0%, transparent 60%);
}
.hero__copy {
  display: grid;
  gap: 14px;
  max-width: 40rem;
  padding: clamp(24px, 4vw, 48px);
  padding-bottom: clamp(28px, 3.4vw, 44px);
}
.hero__eyebrow {
  justify-self: start;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--hero-glass);
  border: 1px solid var(--hero-glass-stroke);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  font: var(--type-label);
}
.hero h1 { font: var(--type-display); letter-spacing: 0; }
.hero h1 em { font-style: normal; }
.hero__sub { font: var(--type-lede); max-width: 34ch; }
.hero__meta { font-size: var(--size-small); color: var(--hero-text-muted); }
.hero__credit {
  position: absolute;
  right: clamp(20px, 3vw, 32px);
  bottom: 16px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: var(--hero-glass-faint);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  font: var(--type-caption);
  color: var(--hero-text-muted);
}
/* A callout overlays the photo's top corner, so the hero keeps room for it above the copy. */
@media (min-width: 900px) { .hero:has(> .callout) { min-height: clamp(420px, 56vh, 560px); } }
.hero > .callout {
  position: absolute;
  top: clamp(16px, 2.4vw, 24px);
  right: clamp(16px, 2.4vw, 24px);
  width: min(320px, calc(100% - 32px));
}
@media (max-width: 899px) {
  .hero { flex-direction: column; justify-content: flex-end; align-items: stretch; min-height: 0; }
  .hero__img { object-position: 22% 50%; }
  .hero__copy { padding-top: 140px; padding-bottom: 28px; }
  .hero:not(:has(.hero__img)) .hero__copy { padding-top: clamp(24px, 4vw, 48px); }
  .hero__credit { top: 16px; right: 16px; bottom: auto; }
  .hero > .callout { position: static; width: auto; margin: 0 12px 12px; }
}
/* On a phone the title starts higher, so the first screen reaches the stats. */
@media (max-width: 599px) { .hero__copy { padding-top: 88px; padding-bottom: 20px; } }
/* @component callout */
.callout {
  max-width: 420px;
  display: grid;
  gap: 10px;
  padding: 16px 18px 18px;
  border-radius: var(--r-l);
  background: var(--mat-agent);
  -webkit-backdrop-filter: var(--hark-blur);
  backdrop-filter: var(--hark-blur);
  border: 1px solid var(--stroke-composer);
  box-shadow: var(--hark-shadow);
  color: var(--text-primary);
  font-size: var(--size-small);
}
.callout__head { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-weight: var(--weight-medium); }
.callout__head svg { color: var(--text-primary); }
.callout__lead { font-size: var(--size-body); }
.callout .fineprint { font-size: var(--size-caption); }
.callout .btn { justify-self: start; }
/* @component stats */
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding-top: 8px; }
.stat {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 4px;
  padding: 12px 24px;
  border-left: 1px solid var(--stroke-secondary);
}
.stat:first-child { border-left: 0; padding-left: 0; }
.stat__fig { font: var(--type-figure); font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--size-small); color: var(--text-secondary); }
@media (max-width: 760px) {
  .stats { grid-auto-flow: row; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; padding-top: 0; }
  .stat { grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; gap: 12px; padding: 14px 0; border-left: 0; border-top: 1px solid var(--stroke-secondary); }
  .stat:first-child { border-top: 0; }
}
/* On a phone the stats sit two to a row, figure over label. */
@media (max-width: 599px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 0; }
  .stat { grid-column: auto; grid-template-columns: none; gap: 2px; padding: 12px 0; }
  .stat:nth-child(2) { border-top: 0; }
  .stat:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--stroke-secondary); }
  .stat__fig { font-size: 26px; line-height: 1.15; }
  .stat__label { font-size: var(--size-caption); }
}
/* @component section */
.section {
  padding-block: clamp(40px, 6vw, 72px) clamp(16px, 2vw, 24px);
  border-top: 1px solid var(--stroke-secondary);
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); /* Clears the sticky .nav: its top offset plus its tallest height, 56px. */
  min-width: 0;
}
.section > * + * { margin-top: clamp(20px, 2.4vw, 28px); }
.section > .head + * { margin-top: 0; }
.head {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 10px 40px;
  align-items: end;
  margin-bottom: clamp(24px, 3vw, 36px);
}
.head__eyebrow { grid-column: 1 / -1; font: var(--type-label); color: var(--text-secondary); }
.head h2 { font: var(--type-title); }
.head__sub { justify-self: end; font-size: var(--size-body); color: var(--text-secondary); max-width: 44ch; text-align: right; }

  // the nav, and comes back when the page shows it. The link's own display is set, since .seg a sets one.
  function syncNav() {
    [].slice.call(doc.querySelectorAll("a[data-for]")).forEach(function (a) {
      var s = doc.getElementById(a.getAttribute("data-for"));
      a.style.display = s && s.closest("[hidden]") ? "none" : "";

      [].slice.call(t.querySelectorAll("tbody tr")).forEach(function (tr) {
        [].slice.call(tr.children).forEach(function (c, i) {

  // closes the other days, only on a phone.
  function dayToggles() {
    [].slice.call(doc.querySelectorAll(".timeline > li")).forEach(function (day, i) {
      var what = day.querySelector(".timeline__what");
      if (!what || !what.querySelector(".plan") || what.querySelector(".day__toggle")) return;

      label();
    });
    label();

    var seg = doc.querySelector(".seg");
    if (seg) {
      var links = [].slice.call(seg.querySelectorAll("a"));
      var targets = links.map(function (a) { return doc.getElementById(a.getAttribute("href").slice(1)); });
      var active = -2;
      var reveal = function (i) {

        targets.forEach(function (t, i) { if (t && !t.closest("[hidden]") && t.getBoundingClientRect().top <= line) cur = i; });

      if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { sync(true); });
      sync(true);
    }

  }

  function start() {
    autoNav();
    dayToggles();
    behaviors();
  }
  if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", start);
  else start();
})();

      ["Título","Só se a proposta pedir"]

UI.myfc=w=>{FW=w&&byIdSafe(w)?w:'';FE=null;show(`${btn('← Início','UI.home()',{c:'x-back'})}<h2 style="margin-top:8px">🗂️ Meus flashcards</h2><p class="x-mut">Todos os seus cards, de todas as matérias.</p><div id="fcs">${fcHTML('')}</div>`,'home')};
UI.fcSave=id=>{const g=x=>document.getElementById(x),f=g('fcf').value.trim(),v=g('fcv').value.trim(),w=id||g('fcw').value;
  if(!f||!v){g('fcm').textContent='Preencha a frente e o verso.';return}
  const c=FE&&P.fc.find(c=>c.id===FE);if(c)Object.assign(c,{f,v,w});else P.fc.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,f,v});
  FE=null;fcR(id);g('fcm').textContent='Card salvo. 💜'};
UI.fcEdit=(id,cid)=>{FE=cid||null;fcR(id);const t=document.getElementById('fcf');t.focus();t.scrollIntoView({block:'center',behavior:sm()})};
UI.fcDel=(id,cid)=>{P.fc=P.fc.filter(c=>c.id!==cid);if(FE===cid)FE=null;fcR(id)};
UI.fcRev=id=>{const L=fcList(id),back=id?`UI.subj('${id}')`:`UI.myfc('${FW}')`;if(!L.length)return;
  M={q:shuf(L.map((_,j)=>j)),f:{cards:L.map(c=>[c.f,c.v])},head:`${btn('← Meus flashcards',back,{c:'x-back'})}<p class="x-tag">Revisando meus cards${id?' · '+esc(byId(id).nome):FW?' · '+esc(byId(FW).nome):''}</p>`,
  end:btn('Revisar de novo',`UI.fcRev('${id}')`,{p:1,e:1})+btn('Voltar',back)};UI.card(false)};

// Marca-texto nas lições
const lesTxt=k=>{const[w,f,l]=k.split('.');return byId(w).fases[+f].lessons[+l]};
const hPos=(t,h)=>t.substr(h[2],h[0].length)===h[0]?h[2]:t.indexOf(h[0]);
function lesHTML(k){const t=lesTxt(k),col=Array(t.length).fill('');
  (P.hl[k]||[]).forEach(h=>{const i=hPos(t,h);if(i>=0)for(let j=i;j<i+h[0].length;j++)col[j]=h[1]});
  let s='',j=0;while(j<t.length){let e=j;while(e<t.length&&col[e]===col[j])e++;const x=esc(t.slice(j,e));s+=col[j]?`<mark class="x-hl x-hl-${col[j]}">${x}</mark>`:x;j=e}return s}
const HB=document.createElement('div');HB.className='x-hlbar';HB.setAttribute('role','toolbar');HB.setAttribute('aria-label','Marca-texto');
HB.innerHTML=[['y','amarelo'],['p','rosa'],['g','verde']].map(([c,n])=>`<button data-c="${c}" class="x-hl-${c}" aria-label="Destacar em ${n}"></button>`).join('')+'<button data-c="">Apagar</button>';
document.querySelector('.x-wrap').appendChild(HB);
const hlAct=c=>{if(!SEL)return;let{k,a,b}=SEL;const t=lesTxt(k);while(a<b&&/\s/.test(t[a]))a++;while(b>a&&/\s/.test(t[b-1]))b--;
  const L=(P.hl[k]||[]).filter(h=>{const i=hPos(t,h);return i<0||i+h[0].length<=a||i>=b});if(c&&b>a)L.push([t.slice(a,b),c,a]);
  if(L.length)P.hl[k]=L;else delete P.hl[k];const p=document.getElementById('x-les');if(p&&p.dataset.k===k)p.innerHTML=lesHTML(k);
  try{getSelection().removeAllRanges()}catch(e){}HB.classList.remove('on');SEL=null;save()};
HB.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();hlAct(b.dataset.c)});
HB.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&e.detail===0)hlAct(b.dataset.c)});
const hlPlace=()=>{const s=getSelection(),p=document.getElementById('x-les');
  if(!p||!s.rangeCount||s.isCollapsed){clearTimeout(HT);HT=setTimeout(()=>{const s2=getSelection();if(!s2.rangeCount||s2.isCollapsed)HB.classList.remove('on')},300);return}
  const r=s.getRangeAt(0);if(!p.contains(r.commonAncestorContainer)){HB.classList.remove('on');return}
  const pre=document.createRange();pre.selectNodeContents(p);pre.setEnd(r.startContainer,r.startOffset);const a=pre.toString().length,b=a+r.toString().length;if(b<=a)return;
  SEL={k:p.dataset.k,a,b};const rc=r.getBoundingClientRect();HB.classList.add('on');const w=HB.offsetWidth,h=HB.offsetHeight;
  HB.style.left=Math.max(8,Math.min(innerWidth-w-8,rc.left+rc.width/2-w/2))+'px';HB.style.top=(rc.bottom+10+h>innerHeight-90?Math.max(8,rc.top-h-10):rc.bottom+10)+'px'};
document.addEventListener('selectionchange',hlPlace);addEventListener('scroll',()=>{if(HB.classList.contains('on'))hlPlace()},{passive:true});
UI.hls=(id,fi)=>{const w=byId(id),f=w.fases[fi],ls=f.lessons.map((_,li)=>[li,P.hl[id+'.'+fi+'.'+li]||[]]).filter(x=>x[1].length);
  show(`${btn('← '+esc(f.titulo),`UI.topic('${id}',${fi})`,{c:'x-back'})}<p class="x-tag">${esc(w.nome)}</p><h2 style="margin-top:8px">🖍️ Meus destaques</h2>
  ${ls.length?ls.map(([li,H])=>`<div class="x-card"><p class="x-mut">Lição ${li+1}</p>${H.map(h=>`<p><mark class="x-hl x-hl-${h[1]}">${esc(h[0])}</mark></p>`).join('')}${btn('Abrir lição',`UI.topic('${id}',${fi},0,${li})`)}</div>`).join('')
  :'<div class="x-card x-c"><p>Nenhum destaque ainda. 🖍️</p><p class="x-mut">Em Estudar, selecione um trecho da lição e escolha uma cor.</p></div>'}`,'home')};

UI.topic=(id,fi,step=0,i=0)=>{const w=byId(id),f=w.fases[fi];
  const head=`${btn('← '+esc(w.nome),`UI.subj('${id}',1)`,{c:'x-back'})}<p class="x-tag">${esc(f.titulo)}</p><div class="x-tabs" role="tablist">${['Estudar','Memorizar','Praticar'].map((t,s)=>`<button role="tab" class="x-tab" aria-selected="${s===step}" onclick="UI.topic('${id}',${fi},${s})">${s+1}. ${t}</button>`).join('')}</div>`;
  if(step===0){const n=f.lessons.length;return show(head+`<article class="x-card"><p class="x-mut">Lição ${i+1} de ${n} · selecione um trecho para destacar</p><p id="x-les" data-k="${id}.${fi}.${i}">${lesHTML(id+'.'+fi+'.'+i)}</p></article>
    <div class="x-row">${btn('← Anterior',`UI.topic('${id}',${fi},0,${i-1})`,{d:i===0})}${i<n-1?btn('Próximo →',`UI.topic('${id}',${fi},0,${i+1})`,{p:1,e:1}):btn('Memorizar →',`UI.topic('${id}',${fi},1)`,{p:1,e:1})}${btn('🖍️ Meus destaques',`UI.hls('${id}',${fi})`)}</div>`)}
  if(step===1){M={q:f.cards.map((_,j)=>j),f,head,id,fi};return UI.card(false)}
  practice({keys:shuf(f.questions.map((_,qi)=>id+'.'+fi+'.'+qi)),head,fk:id+'.'+fi,again:`UI.topic('${id}',${fi},2)`})};

UI.card=flip=>{if(!M.q.length)return show(M.head+`<div class="x-card x-c"><p class="x-big">🌷</p><h3>Todos os cartões revisados!</h3><p>Ótimo trabalho.${M.end?'':' Que tal praticar agora?'}</p>
    <div class="x-row x-ctr">${M.end||btn('Praticar →',`UI.topic('${M.id}',${M.fi},2)`,{p:1,e:1})+btn('Ver os cartões de novo',`UI.topic('${M.id}',${M.fi},1)`)}</div></div>`);
  const c=M.f.cards[M.q[0]];
  show(M.head+`<p class="x-mut">Cartões que faltam: ${M.q.length}</p><button class="x-card x-flash${flip?' on':''}" onclick="UI.card(${!flip})"${flip?'':' data-enter'}><span class="x-front">${esc(c[0])}</span>${flip?`<span>${esc(c[1])}</span>`:'<span class="x-mut">Toque para virar</span>'}</button>
  ${flip?`<div class="x-row">${btn('<kbd>1</kbd> Já sei','UI.know(1)',{p:1,k:1})}${btn('<kbd>2</kbd> Revisar de novo','UI.know(0)',{k:2})}</div>`:''}`)};
UI.know=ok=>{const c=M.q.shift();if(!ok)M.q.push(c);UI.card(false)};

function practice(o){if(!o.keys.length)return UI.errors();R=Object.assign({i:0,right:0,by:{}},o);ask()}
function ask(){const k=R.keys[R.i],Q=getQ(k);R.ord=shuf(Q.a.map((_,j)=>j));R.done=0;
  show(R.head+`<p class="x-mut">Questão ${R.i+1} de ${R.keys.length}${R.sim?' · '+esc(byId(k.split('.')[0]).nome):''}</p>${bar(pct(R.i,R.keys.length))}<p class="x-q">${esc(Q.q)}</p>
  <div class="x-alts">${R.ord.map((a,j)=>`<button class="x-b x-alt" data-k="${j+1}" onclick="UI.ans(${j})"><kbd>${j+1}</kbd><span>${esc(Q.a[a])}</span></button>`).join('')}</div><div id="fb"></div>`)}
UI.ans=j=>{if(!R||R.done)return;R.done=1;const k=R.keys[R.i],Q=getQ(k),ok=R.ord[j]===Q.c,w=k.split('.')[0],b=R.by[w]=R.by[w]||[0,0];
  P.a++;b[1]++;if(ok){P.r++;R.right++;b[0]++;if(R.err)P.e=P.e.filter(x=>x!==k)}else if(!P.e.includes(k))P.e.push(k);
  app.querySelectorAll('.x-alt').forEach((el,x)=>{el.disabled=true;if(R.ord[x]===Q.c)el.classList.add('ok');else if(x===j)el.classList.add('no')});
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="x-fb ${ok?'ok':'no'}"><h3>${ok?'Isso mesmo! 💚':'Quase! A resposta é: '+esc(Q.a[Q.c])}</h3><p>${esc(Q.exp)}</p>${btn(R.i+1>=R.keys.length?'Ver resultado':'Próxima →','UI.next()',{p:1,e:1})}</div>`;
  fb.scrollIntoView({block:'nearest',behavior:sm()})};
UI.next=()=>{R.i++;if(R.i<R.keys.length)return ask();
  const n=R.keys.length,p=pct(R.right,n);if(R.fk)P.d[R.fk]=Math.max(P.d[R.fk]||0,p);
  const msg=p>=80?'Excelente! Você está muito bem preparada. 🌟':p>=50?'Bom trabalho! Cada questão te deixa mais perto. 💜':'Tudo bem errar: é assim que se aprende. Revise com calma e tente de novo. 🌱';
  const by=R.sim?`<h3>Resultado por matéria</h3>`+Object.keys(R.by).map(id=>{const[a,t]=R.by[id],w=byId(id);return `<div class="x-rl"><span>${w.icone} ${esc(w.nome)}</span><b>${a}/${t}</b>${bar(pct(a,t))}</div>`}).join(''):'';
  show(R.head+`<div class="x-card x-c"><p class="x-big">${R.right}/${n}</p><p>acertos · ${p}%</p><p>${msg}</p>${by}
  <div class="x-row x-ctr x-mt">${btn(R.sim?'Novo simulado':'Praticar de novo',R.again,{p:1,e:1})}${btn('Caderno de erros','UI.errors()')}</div></div>`)};

UI.errors=()=>show(`<h2>Caderno de erros</h2>${P.e.length?`<p class="x-mut">${P.e.length} ${P.e.length>1?'questões':'questão'} para revisar. Ao acertar na revisão, ela sai do caderno.</p><div class="x-row">${btn('Revisar estes','UI.revErr()',{p:1,e:1})}</div>`+
  P.e.map(k=>{const Q=getQ(k),w=byId(k.split('.')[0]);return `<div class="x-card"><p class="x-tag">${w.icone} ${esc(w.nome)}</p><h3>${esc(Q.q)}</h3><p class="x-okt">✓ ${esc(Q.a[Q.c])}</p><p class="x-mut">${esc(Q.exp)}</p></div>`}).join('')
  :'<div class="x-card x-c"><p>Nenhum erro anotado por aqui. 🌿</p><p class="x-mut">As questões que você errar ao praticar aparecem aqui para revisão.</p></div>'}`,'err');
UI.revErr=()=>practice({keys:shuf(P.e),head:`${btn('← Caderno de erros','UI.errors()',{c:'x-back'})}<p class="x-tag">Revisando o caderno de erros</p>`,err:1,again:'UI.revErr()'});

UI.sim=()=>{if(!TR[SM.tr])SM.tr=T;const u=SM.tr==='uece';show(`<h2>Simulado</h2><p>Questões misturadas, sem tempo. No fim, você vê o resultado por matéria.</p>
  <h3>Qual prova?</h3><div class="x-row">${Object.keys(TR).map(k=>`<button class="x-b" aria-pressed="${SM.tr===k}" onclick="UI.simSet('tr','${k}')">${esc(TR[k].nome)}</button>`).join('')}</div>
  <h3>Quantas questões?</h3><div class="x-row">${[10,20,40].map(n=>`<button class="x-b" aria-pressed="${SM.n===n}" onclick="UI.simSet('n',${n})">${n}</button>`).join('')}</div>
  ${u?`<h3>Quais matérias?</h3><div class="x-row">${['Todas as matérias','Só a 2ª fase de Psicologia'].map((t,i)=>`<button class="x-b" aria-pressed="${SM.s===i}" onclick="UI.simSet('s',${i})">${t}</button>`).join('')}</div>`:''}
  <div class="x-row x-mt">${btn('Começar simulado','UI.simGo()',{p:1,e:1})}</div>`,'sim')};
UI.simSet=(k,v)=>{SM[k]=v;UI.sim()};
UI.simGo=()=>{const u=SM.tr==='uece',s=u&&SM.s,ids=trIds(SM.tr).filter(id=>!s||SEG.includes(id));
  practice({keys:shuf(ids.map(byId).flatMap(wKeys)).slice(0,SM.n),sim:1,again:'UI.sim()',
  head:`${btn('← Simulado','UI.sim()',{c:'x-back'})}<p class="x-tag">Simulado ${esc(TR[SM.tr].nome)} · ${SM.n} questões · ${s?'2ª fase':'todas as matérias'}</p>`})};

UI.metodos=()=>show(`<h2>Estudar melhor</h2><p class="x-mut">Jeitos simples de estudar que funcionam de verdade.</p>
  <div class="x-cards">${(D.metodos||[]).map(m=>`<div class="x-card"><h3>${esc(m.t)}</h3><p>${esc(m.d)}</p></div>`).join('')}</div>
  <h2>Plano semanal sugerido</h2><div class="x-card">${(D.plano||[]).map(p=>`<div class="x-plan"><b>${esc(p.dia)}</b><ul>${p.itens.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`,'met');

UI.provas=()=>show(`<h2>Provas anteriores oficiais</h2><p>Faça a prova no tempo real e corrija com o gabarito oficial.</p>
  <div class="x-list">${(D.provas||[]).map(p=>`<a class="x-sc" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="x-sn">${esc(p.nome)}</span><span class="x-mut">Abre em nova aba ↗</span></a>`).join('')}</div>
  <h2>Sobre a prova</h2><div class="x-cards"><div class="x-card"><h3>Vestibular UECE – Psicologia</h3>
  <p><b>1ª fase:</b> 85 questões de 4 alternativas (Português 12, Matemática 10, Biologia 8, Física 8, Química 8, Geografia 8, História 8, Língua Estrangeira 8, Filosofia 5, Sociologia 5, Educação Física 5).</p>
  <p style="margin-top:10px"><b>2ª fase de Psicologia:</b> Redação + Língua Portuguesa, Filosofia e Sociologia (20 questões cada).</p><p class="x-mut" style="margin-top:10px">Fonte: Edital 05/2026 CEV/UECE.</p></div>
  ${D.sobreEnem?`<div class="x-card"><h3>ENEM</h3><p>${esc(D.sobreEnem)}</p></div>`:''}</div>`,'prov');

const enc=()=>btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({},P,{tr:T})))));
UI.code=()=>show(`${btn('← Início','UI.home()',{c:'x-back'})}<div class="x-card"><h3 style="margin-top:0">Salvar ou carregar progresso</h3>
  <p class="x-mut">Copie este código para guardar seu progresso. Para continuar depois, cole o código e toque em Carregar.</p>
  <textarea class="x-in" id="cx" rows="4" aria-label="Código de progresso">${enc()}</textarea><p id="cm" class="x-mut" role="status"></p>
  <div class="x-row">${btn('Copiar','UI.copy()')}${btn('Carregar','UI.load()',{p:1})}</div></div>`,'home');
UI.copy=()=>{const t=document.getElementById('cx');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}document.getElementById('cm').textContent='Código copiado.'};
const apply=o=>{if(!o||typeof o!=='object')throw 0;
  P={t:o.t||{},d:o.d||{},a:+o.a||0,r:+o.r||0,e:(o.e||[]).filter(k=>{try{return !!getQ(k)}catch(x){return false}}),
    fc:(Array.isArray(o.fc)?o.fc:[]).filter(c=>c&&byIdSafe(c.w)&&c.f!=null).map((c,i)=>({id:String(c.id||'c'+i),w:c.w,f:String(c.f),v:String(c.v||'')})),
    hl:Object.fromEntries(Object.entries(o.hl&&typeof o.hl==='object'?o.hl:{}).filter(([k,v])=>{try{return Array.isArray(v)&&typeof lesTxt(k)==='string'}catch(x){return false}}))};
  if(TR[o.tr]){T=o.tr;SM.tr=o.tr;setSub()}};
UI.load=()=>{const m=document.getElementById('cm');try{apply(JSON.parse(decodeURIComponent(escape(atob(document.getElementById('cx').value.trim())))));save();m.textContent='Progresso carregado! 💜'}catch(x){m.textContent='Código inválido. Confira se copiou tudo.'}};
try{const s=localStorage.getItem(LS);if(s)apply(JSON.parse(s))}catch(e){}

document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='TEXTAREA'||t==='INPUT')return;
  if(/^[1-4]$/.test(e.key)){const b=app.querySelector(`[data-k="${e.key}"]:not(:disabled)`);if(b){e.preventDefault();b.click()}}
  else if(e.key==='Enter'&&!(t==='BUTTON'&&!e.target.disabled)){const b=app.querySelector('[data-enter]:not(:disabled)');if(b){e.preventDefault();b.click()}}});
try{const d=document.documentElement.dataset.theme==='dark';document.getElementById('x-theme').textContent=d?'☀️':'🌙'}catch(e){}
window.UI=UI;UI.home();
})();
    </script>
