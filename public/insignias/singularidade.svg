<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#C4B5FD"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="brilho"><stop offset=".45" stop-color="#C4B5FD" stop-opacity=".55"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
    <radialGradient id="nucleo" cx=".4" cy=".35"><stop offset="0" stop-color="#2A2D35"/><stop offset="1" stop-color="#050507"/></radialGradient>
    <clipPath id="frente" clipPathUnits="userSpaceOnUse"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="18" fill="url(#brilho)">
    <animate attributeName="r" values="16;19;16" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g transform="rotate(-20 32 32)">
    <ellipse cx="32" cy="32" rx="26" ry="8.5" fill="none" stroke="url(#anel)" stroke-width="2.6" opacity=".9"/>
    <ellipse cx="32" cy="32" rx="26" ry="8.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" pathLength="100" stroke-dasharray="10 90">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="2" fill="#5EEAD4">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M58 32 A26 8.5 0 1 1 6 32 A26 8.5 0 1 1 58 32"/>
    </circle>
  </g>
  <circle cx="32" cy="32" r="11" fill="url(#nucleo)" stroke="#C4B5FD" stroke-opacity=".6" stroke-width="1"/>
  <g transform="rotate(-20 32 32)" clip-path="url(#frente)">
    <ellipse cx="32" cy="32" rx="26" ry="8.5" fill="none" stroke="url(#anel)" stroke-width="2.6"/>
    <ellipse cx="32" cy="32" rx="26" ry="8.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" pathLength="100" stroke-dasharray="10 90">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
