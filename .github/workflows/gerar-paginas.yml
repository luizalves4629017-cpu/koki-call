name: Gerar imagens das provas oficiais
on:
  push:
    paths:
      - '.github/workflows/gerar-paginas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paginas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar PDF oficial e gerar imagens reais
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          mkdir -p provas/paginas/uece-2026-1-f1
          curl -fL --retry 3 --connect-timeout 20 'https://www.cev.uece.br/wp-content/uploads/2025/10/vtb20261f1g1.pdf' -o /tmp/uece.pdf
          pdfinfo /tmp/uece.pdf | head -20
          pdftoppm -f 1 -l 19 -scale-to 1100 -jpeg -jpegopt quality=75,optimize=y /tmp/uece.pdf provas/paginas/uece-2026-1-f1/pagina
          python3 - <<'PY'
          import os,re
          p='provas/paginas/uece-2026-1-f1'
          for f in os.listdir(p):
              m=re.fullmatch(r'pagina-(\d+)\.jpg',f)
              if m:
                  os.rename(os.path.join(p,f),os.path.join(p,f'pagina-{int(m.group(1)):02d}.jpg'))
          print('Páginas geradas:',len(os.listdir(p)))
          PY
      - name: Publicar imagens no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provas/paginas/uece-2026-1-f1
          git diff --cached --quiet || (git commit -m 'Adiciona imagens reais das 19 páginas UECE 2026.1' && git push)
