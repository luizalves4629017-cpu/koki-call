<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Volumes: cubo e cilindro</text><polygon points="90,140 210,140 250,100 130,100" fill="#f7d3e3" stroke="#b5527f" stroke-width="2.5"/><polygon points="210,140 250,100 250,220 210,260" fill="#eda9c6" stroke="#b5527f" stroke-width="2.5"/><rect x="90" y="140" width="120" height="120" fill="#f3bfd5" stroke="#b5527f" stroke-width="2.5"/><text x="150" y="285" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">a</text><text x="170" y="330" font-size="18" text-anchor="middle" font-weight="700" fill="#33263d">Cubo: V = a³</text><text x="170" y="356" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">a = 3 cm → V = 27 cm³</text><ellipse cx="460" cy="250" rx="80" ry="22" fill="#cfe3f6" stroke="#4f7fb3" stroke-width="2.5"/><rect x="380" y="110" width="160" height="140" fill="#cfe3f6" stroke="none"/><line x1="380" y1="110" x2="380" y2="250" stroke="#4f7fb3" stroke-width="2.5"/><line x1="540" y1="110" x2="540" y2="250" stroke="#4f7fb3" stroke-width="2.5"/><ellipse cx="460" cy="110" rx="80" ry="22" fill="#e3effa" stroke="#4f7fb3" stroke-width="2.5"/><line x1="460" y1="110" x2="540" y2="110" stroke="#33263d" stroke-width="2"/><text x="500" y="102" font-size="16" text-anchor="middle" font-weight="400" fill="#33263d">r</text><line x1="560" y1="110" x2="560" y2="250" stroke="#33263d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="572" y="186" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">h</text><text x="460" y="330" font-size="18" text-anchor="middle" font-weight="700" fill="#33263d">Cilindro: V = π · r² · h</text><text x="460" y="356" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">área da base × altura</text></svg>