<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Estrutura do texto dissertativo-argumentativo</text><rect x="70" y="62" width="500" height="62" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="95" y="90" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Introdução</text><text x="95" y="116" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">apresenta o tema e a tese (seu ponto de vista)</text><rect x="70" y="138" width="500" height="62" rx="12" fill="#cfe3f6" stroke="#7a2e5a" stroke-width="2"/><text x="95" y="166" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Desenvolvimento 1</text><text x="95" y="192" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">argumento + exemplo, dado ou repertório</text><rect x="70" y="214" width="500" height="62" rx="12" fill="#cfe3f6" stroke="#7a2e5a" stroke-width="2"/><text x="95" y="242" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Desenvolvimento 2</text><text x="95" y="268" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">novo argumento, ligado ao anterior por conectivos</text><rect x="70" y="290" width="500" height="62" rx="12" fill="#d4eedb" stroke="#7a2e5a" stroke-width="2"/><text x="95" y="318" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Conclusão</text><text x="95" y="344" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">retoma a tese e fecha o raciocínio</text><line x1="320" y1="124" x2="320" y2="136" stroke="#7a2e5a" stroke-width="2.5"/><polygon points="320,136 315.7,127.0 324.3,127.0" fill="#7a2e5a"/><line x1="320" y1="200" x2="320" y2="212" stroke="#7a2e5a" stroke-width="2.5"/><polygon points="320,212 315.7,203.0 324.3,203.0" fill="#7a2e5a"/><line x1="320" y1="276" x2="320" y2="288" stroke="#7a2e5a" stroke-width="2.5"/><polygon points="320,288 315.7,279.0 324.3,279.0" fill="#7a2e5a"/></svg>