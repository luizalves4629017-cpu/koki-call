<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Conjuntos: A = {1, 2, 3, 4} e B = {3, 4, 5}</text><rect x="40" y="60" width="560" height="280" rx="16" fill="#fff" stroke="#b9a3c6" stroke-width="2"/><text x="66" y="88" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">U</text><circle cx="255" cy="200" r="115" fill="#cfe3f6" fill-opacity=".8" stroke="#4f7fb3" stroke-width="3"/><circle cx="385" cy="200" r="115" fill="#f7c6db" fill-opacity=".7" stroke="#b5527f" stroke-width="3"/><text x="190" y="118" font-size="22" text-anchor="middle" font-weight="700" fill="#33263d">A</text><text x="450" y="118" font-size="22" text-anchor="middle" font-weight="700" fill="#33263d">B</text><text x="195" y="195" font-size="24" text-anchor="middle" font-weight="400" fill="#33263d">1</text><text x="205" y="240" font-size="24" text-anchor="middle" font-weight="400" fill="#33263d">2</text><text x="320" y="190" font-size="24" text-anchor="middle" font-weight="400" fill="#33263d">3</text><text x="320" y="235" font-size="24" text-anchor="middle" font-weight="400" fill="#33263d">4</text><text x="445" y="215" font-size="24" text-anchor="middle" font-weight="400" fill="#33263d">5</text><text x="320" y="375" font-size="17" text-anchor="middle" font-weight="600" fill="#33263d">A ∩ B = {3, 4}     A ∪ B = {1, 2, 3, 4, 5}     A − B = {1, 2}</text></svg>