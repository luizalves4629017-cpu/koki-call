<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Discurso direto → indireto</text><rect x="40" y="58" width="560" height="62" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="84" font-size="18" text-anchor="middle" font-weight="700" fill="#33263d">Maria said, "I am tired."</text><text x="320" y="108" font-size="17" text-anchor="middle" font-weight="600" fill="#7a2e5a">→ Maria said (that) she was tired.</text><rect x="120" y="134" width="400" height="40" fill="#fbf3f7"/><text x="240" y="161" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">am / is</text><text x="320" y="161" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">→</text><text x="400" y="161" font-size="17" text-anchor="middle" font-weight="700" fill="#33263d">was</text><rect x="120" y="174" width="400" height="40" fill="#fff"/><text x="240" y="201" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">will</text><text x="320" y="201" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">→</text><text x="400" y="201" font-size="17" text-anchor="middle" font-weight="700" fill="#33263d">would</text><rect x="120" y="214" width="400" height="40" fill="#fbf3f7"/><text x="240" y="241" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">can</text><text x="320" y="241" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">→</text><text x="400" y="241" font-size="17" text-anchor="middle" font-weight="700" fill="#33263d">could</text><rect x="120" y="254" width="400" height="40" fill="#fff"/><text x="240" y="281" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">today</text><text x="320" y="281" font-size="17" text-anchor="middle" font-weig