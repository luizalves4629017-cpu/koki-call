<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Escala de mapa 1 : 50.000</text><rect x="70" y="110" width="500" height="26" fill="#fff" stroke="#33263d" stroke-width="2"/><rect x="70" y="110" width="100" height="26" fill="#33263d"/><rect x="170" y="110" width="100" height="26" fill="#fff"/><rect x="270" y="110" width="100" height="26" fill="#33263d"/><rect x="370" y="110" width="100" height="26" fill="#fff"/><rect x="470" y="110" width="100" height="26" fill="#33263d"/><text x="70" y="160" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">0</text><text x="170" y="160" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">500 m</text><text x="270" y="160" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">1000 m</text><text x="370" y="160" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">1500 m</text><text x="470" y="160" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">2000 m</text><text x="570" y="160" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">2500 m</text><text x="120" y="98" font-size="14" text-anchor="middle" font-weight="400" fill="#33263d">1 cm</text><rect x="80" y="190" width="480" height="140" rx="12" fill="#fff" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="225" font-size="18" text-anchor="middle" font-weight="700" fill="#33263d">1 cm no mapa = 50.000 cm no real</text><text x="320" y="258" font-size="17" text-anchor="middle" font-weight="400" fill="#33263d">50.000 cm = 500 m = 0,5 km</text><text x="320" y="292" font-size="17" text-anchor="middle" font-weight="600" fill="#7a2e5a">Ex.: 8 cm no mapa → 8 × 0,5 km = 4 km</text></svg>