<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Coesão: conectivos e o sentido que expressam</text><rect x="60" y="62" width="520" height="48" rx="12" fill="#d4eedb" stroke="#7a2e5a" stroke-width="2"/><text x="90" y="93" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">Adição</text><text x="560" y="93" font-size="16" text-anchor="end" font-weight="400" fill="#33263d">e, além disso, também</text><rect x="60" y="120" width="520" height="48" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="90" y="151" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">Oposição</text><text x="560" y="151" font-size="16" text-anchor="end" font-weight="400" fill="#33263d">mas, porém, entretanto, embora</text><rect x="60" y="178" width="520" height="48" rx="12" fill="#cfe3f6" stroke="#7a2e5a" stroke-width="2"/><text x="90" y="209" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">Causa</text><text x="560" y="209" font-size="16" text-anchor="end" font-weight="400" fill="#33263d">porque, pois, já que</text><rect x="60" y="236" width="520" height="48" rx="12" fill="#fbecc4" stroke="#7a2e5a" stroke-width="2"/><text x="90" y="267" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">Conclusão</text><text x="560" y="267" font-size="16" text-anchor="end" font-weight="400" fill="#33263d">portanto, logo, por isso</text><rect x="60" y="294" width="520" height="48" rx="12" fill="#eadcf3" stroke="#7a2e5a" stroke-width="2"/><text x="90" y="325" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">Condição</text><text x="560" y="325" font-size="16" text-anchor="end" font-weight="400" fill="#33263d">se, caso, desde que</text><text x="320" y="385" font-size="14" text-anchor="middle" font-weight="600" fill="#7a2e5a">“Estudaram muito; por isso, foram aprovados.” → conclusão/consequência</text></svg>