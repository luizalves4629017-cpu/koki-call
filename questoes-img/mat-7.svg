<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Fórmulas de área</text><rect x="60" y="90" width="140" height="100" fill="#cfe3f6" stroke="#4f7fb3" stroke-width="3"/><text x="130" y="210" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">b = 8 m</text><text x="54" y="145" font-size="15" text-anchor="end" font-weight="400" fill="#33263d">h = 5</text><text x="130" y="250" font-size="17" text-anchor="middle" font-weight="700" fill="#33263d">Retângulo</text><text x="130" y="278" font-size="16" text-anchor="middle" font-weight="400" fill="#33263d">A = b · h = 40 m²</text><polygon points="250,190 410,190 330,90" fill="#f7d3e3" stroke="#b5527f" stroke-width="3"/><line x1="330" y1="90" x2="330" y2="190" stroke="#b5527f" stroke-dasharray="6 5" stroke-width="2"/><text x="330" y="210" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">b = 10 cm</text><text x="338" y="150" font-size="15" text-anchor="start" font-weight="400" fill="#33263d">h = 6</text><text x="330" y="250" font-size="17" text-anchor="middle" font-weight="700" fill="#33263d">Triângulo</text><text x="330" y="278" font-size="16" text-anchor="middle" font-weight="400" fill="#33263d">A = b · h ÷ 2 = 30 cm²</text><circle cx="525" cy="140" r="55" fill="#d4eedb" stroke="#3c8a55" stroke-width="3"/><line x1="525" y1="140" x2="580" y2="140" stroke="#3c8a55" stroke-width="2.5"/><text x="552" y="132" font-size="16" text-anchor="middle" font-weight="400" fill="#33263d">r</text><text x="525" y="250" font-size="17" text-anchor="middle" font-weight="700" fill="#33263d">Círculo</text><text x="525" y="278" font-size="16" text-anchor="middle" font-weight="400" fill="#33263d">A = π · r²</text><text x="320" y="345" font-size="16" text-anchor="middle" font-weight="600" fill="#33263d">Trapézio: A = (B + b) · h ÷ 2</text></svg>