<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Índice de massa corporal (adultos, OMS)</text><rect x="60" y="58" width="520" height="70" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="88" font-size="20" text-anchor="middle" font-weight="700" fill="#33263d">IMC = massa (kg) ÷ altura² (m)</text><text x="320" y="114" font-size="16" text-anchor="middle" font-weight="400" fill="#33263d">Ex.: 70 ÷ 1,75² = 70 ÷ 3,0625 ≈ 22,9</text><rect x="100" y="142" width="440" height="44" rx="8" fill="#cfe3f6" stroke="#a89" stroke-width="2"/><text x="130" y="170" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">abaixo de 18,5</text><text x="510" y="170" font-size="17" text-anchor="end" font-weight="400" fill="#33263d">baixo peso</text><rect x="100" y="194" width="440" height="44" rx="8" fill="#d4eedb" stroke="#a89" stroke-width="2"/><text x="130" y="222" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">18,5 a 24,9</text><text x="510" y="222" font-size="17" text-anchor="end" font-weight="400" fill="#33263d">peso adequado</text><rect x="100" y="246" width="440" height="44" rx="8" fill="#fbecc4" stroke="#a89" stroke-width="2"/><text x="130" y="274" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">25 a 29,9</text><text x="510" y="274" font-size="17" text-anchor="end" font-weight="400" fill="#33263d">sobrepeso</text><rect x="100" y="298" width="440" height="44" rx="8" fill="#f7c6c6" stroke="#a89" stroke-width="2"/><text x="130" y="326" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">30 ou mais</text><text x="510" y="326" font-size="17" text-anchor="end" font-weight="400" fill="#33263d">obesidade</text><text x="320" y="388" font-size="15" text-anchor="middle" font-weight="600" fill="#7a2e5a">O IMC não separa músculo de gordura</text></svg>