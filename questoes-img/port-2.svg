<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Crase: preposição a + artigo a = à</text><rect x="60" y="70" width="520" height="70" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="100" font-size="20" text-anchor="middle" font-weight="700" fill="#33263d">Vou a + a escola  →  Vou à escola</text><text x="320" y="126" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">(quem vai, vai a; “escola” aceita o artigo a)</text><rect x="60" y="160" width="520" height="70" rx="12" fill="#cfe3f6" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="190" font-size="20" text-anchor="middle" font-weight="700" fill="#33263d">Vou a Fortaleza  (sem crase)</text><text x="320" y="216" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">Dica: “volto de Fortaleza” → sem artigo → sem crase</text><rect x="60" y="250" width="520" height="70" rx="12" fill="#d4eedb" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="280" font-size="20" text-anchor="middle" font-weight="700" fill="#33263d">Volto da Bahia → Vou à Bahia</text><text x="320" y="306" font-size="15" text-anchor="middle" font-weight="400" fill="#33263d">“da” = de + a → tem artigo → crase</text><text x="320" y="360" font-size="16" text-anchor="middle" font-weight="600" fill="#7a2e5a">Não há crase antes de verbo nem de palavra masculina</text></svg>