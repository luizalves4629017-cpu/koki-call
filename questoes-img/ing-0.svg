<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Estratégias de leitura em inglês</text><rect x="50" y="62" width="540" height="62" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="75" y="90" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Skimming</text><text x="75" y="116" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">leitura rápida para captar a ideia geral</text><rect x="50" y="138" width="540" height="62" rx="12" fill="#cfe3f6" stroke="#7a2e5a" stroke-width="2"/><text x="75" y="166" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Scanning</text><text x="75" y="192" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">procurar uma informação específica (data, nome, número)</text><rect x="50" y="214" width="540" height="62" rx="12" fill="#fbecc4" stroke="#7a2e5a" stroke-width="2"/><text x="75" y="242" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Cognatos</text><text x="75" y="268" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">palavras parecidas com o português: library ≠ livraria!</text><rect x="50" y="290" width="540" height="62" rx="12" fill="#d4eedb" stroke="#7a2e5a" stroke-width="2"/><text x="75" y="318" font-size="18" text-anchor="start" font-weight="700" fill="#33263d">Contexto</text><text x="75" y="344" font-size="17" text-anchor="start" font-weight="400" fill="#33263d">use as palavras vizinhas para deduzir o sentido</text></svg>