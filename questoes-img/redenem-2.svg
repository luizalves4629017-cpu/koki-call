<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Redação do ENEM: as 5 competências</text><rect x="40" y="62" width="560" height="48" rx="12" fill="#fff" stroke="#ccb8d6" stroke-width="2"/><text x="70" y="93" font-size="18" text-anchor="start" font-weight="700" fill="#8a7a94">C1</text><text x="115" y="93" font-size="17" text-anchor="start" font-weight="400" fill="#8a7a94">Norma-padrão da língua escrita</text><text x="585" y="93" font-size="15" text-anchor="end" font-weight="400" fill="#8a7a94">200</text><rect x="40" y="120" width="560" height="48" rx="12" fill="#fff" stroke="#ccb8d6" stroke-width="2"/><text x="70" y="151" font-size="18" text-anchor="start" font-weight="700" fill="#8a7a94">C2</text><text x="115" y="151" font-size="17" text-anchor="start" font-weight="400" fill="#8a7a94">Proposta, tipo textual e repertório</text><text x="585" y="151" font-size="15" text-anchor="end" font-weight="400" fill="#8a7a94">200</text><rect x="40" y="178" width="560" height="48" rx="12" fill="#f7d3e3" stroke="#7a2e5a" stroke-width="2"/><text x="70" y="209" font-size="18" text-anchor="start" font-weight="700" fill="#7a2e5a">C3</text><text x="115" y="209" font-size="17" text-anchor="start" font-weight="700" fill="#33263d">Seleção e organização dos argumentos</text><text x="585" y="209" font-size="15" text-anchor="end" font-weight="700" fill="#33263d">200</text><rect x="40" y="236" width="560" height="48" rx="12" fill="#fff" stroke="#ccb8d6" stroke-width="2"/><text x="70" y="267" font-size="18" text-anchor="start" font-weight="700" fill="#8a7a94">C4</text><text x="115" y="267" font-size="17" text-anchor="start" font-weight="400" fill="#8a7a94">Coesão: conectivos e retomadas</text><text x="585" y="267" font-size="15" text-anchor="end" font-weight="400" fill="#8a7a94">200</text><rect x="40" y="294" width="560" height="48" rx="12" fill="#fff" stroke="#ccb8d6" stroke-width="2"/><text x="70" y="325" font-size="18" text-anchor="start" font-weight="700" fill="#8a7a94">C5</text><text x="115" y="325" font-size="17" text-anchor="start" font-weight="400" fill="#8a7a94">Proposta de intervenção e direitos humanos</text><text x="585" y="325" font-size="15" text-anchor="end" font-weight="400" fill="#8a7a94">200</text><text x="320" y="385" font-size="15" text-anchor="middle" font-weight="700" fill="#7a2e5a">5 competências × 200 pontos = 1000 pontos</text></svg>