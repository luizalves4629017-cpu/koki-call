<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#33263d"><rect width="640" height="400" rx="22" fill="#fff8fb"/><text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#7a2e5a">Determinante de uma matriz 2 × 2</text><path d="M150 90 q-22 70 0 140 M330 90 q22 70 0 140" fill="none" stroke="#33263d" stroke-width="3"/><text x="195" y="140" font-size="34" text-anchor="middle" font-weight="400" fill="#33263d">2</text><text x="285" y="140" font-size="34" text-anchor="middle" font-weight="400" fill="#33263d">3</text><text x="195" y="205" font-size="34" text-anchor="middle" font-weight="400" fill="#33263d">1</text><text x="285" y="205" font-size="34" text-anchor="middle" font-weight="400" fill="#33263d">4</text><line x1="180" y1="110" x2="300" y2="200" stroke="#3c8a55" stroke-width="4" opacity=".7"/><line x1="300" y1="110" x2="180" y2="200" stroke="#b5527f" stroke-width="4" opacity=".7"/><text x="470" y="120" font-size="16" text-anchor="middle" font-weight="600" fill="#3c8a55">diagonal principal:</text><text x="470" y="145" font-size="22" text-anchor="middle" font-weight="700" fill="#33263d">2 · 4 = 8</text><text x="470" y="190" font-size="16" text-anchor="middle" font-weight="600" fill="#b5527f">diagonal secundária:</text><text x="470" y="215" font-size="22" text-anchor="middle" font-weight="700" fill="#33263d">3 · 1 = 3</text><rect x="120" y="270" width="400" height="60" rx="12" fill="#fbecc4" stroke="#7a2e5a" stroke-width="2"/><text x="320" y="308" font-size="26" text-anchor="middle" font-weight="700" fill="#33263d">det = 8 − 3 = 5</text></svg>